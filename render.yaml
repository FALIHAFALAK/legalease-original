databases:
  - name: legalease-db
    databaseName: legalease
    user: legalease
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: legalease-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        fromDatabase:
          name: legalease-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MAX_ATTEMPTS
        value: "3"
      - key: GEMINI_RETRY_BASE_SECONDS
        value: "2"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
